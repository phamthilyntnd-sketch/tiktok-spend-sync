name: TikTok BC spend -> Lark Base
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python tiktok_bc_spend_to_lark.py
        env:
          TT_ACCESS_TOKEN: ${{ secrets.TT_ACCESS_TOKEN }}
          TT_ACCESS_TOKEN_2: ${{ secrets.TT_ACCESS_TOKEN_2 }}
          TT_ACCESS_TOKEN_3: ${{ secrets.TT_ACCESS_TOKEN_3 }}
          TT_ACCESS_TOKEN_4: ${{ secrets.TT_ACCESS_TOKEN_4 }}
          TT_ACCESS_TOKEN_5: ${{ secrets.TT_ACCESS_TOKEN_5 }}
          TT_ACCESS_TOKEN_6: ${{ secrets.TT_ACCESS_TOKEN_6 }}
          TT_ACCESS_TOKEN_7: ${{ secrets.TT_ACCESS_TOKEN_7 }}
          TT_ACCESS_TOKEN_8: ${{ secrets.TT_ACCESS_TOKEN_8 }}
          TT_ACCESS_TOKEN_9: ${{ secrets.TT_ACCESS_TOKEN_9 }}
          TT_ACCESS_TOKEN_10: ${{ secrets.TT_ACCESS_TOKEN_10 }}
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_BASE_TOKEN: ${{ secrets.LARK_BASE_TOKEN }}
          LARK_TABLE_ID: ${{ secrets.LARK_TABLE_ID }}
          DAYS_BACK: "2"
          PARALLEL: "5"
          FETCH_BALANCE: "1"
