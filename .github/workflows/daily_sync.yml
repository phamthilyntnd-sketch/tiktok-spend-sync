name: TikTok BC spend -> Lark Base
on:
  schedule:
    - cron: "0 23 * * *"
  push:
    branches: [main]
    paths: [".run-now"]
  workflow_dispatch:
    inputs:
      days_back:
        description: "So ngay lay lai (1-62). Mac dinh 2"
        required: false
        default: "2"
      months_back:
        description: "So thang truoc lay lai cho bang theo thang (0-12). Mac dinh 0"
        required: false
        default: "0"
concurrency:
  group: tiktok-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python tiktok_bc_spend_to_lark.py
        env:
          TT_ACCESS_TOKEN: ${{ secrets.TT_ACCESS_TOKEN }}
          TT_ACCESS_TOKEN_2: ${{ secrets.TT_ACCESS_TOKEN_2 }}
          TT_ACCESS_TOKEN_3: ${{ secrets.TT_ACCESS_TOKEN_3 }}
          TT_ACCESS_TOKEN_4: ${{ secrets.TT_ACCESS_TOKEN_4 }}
          TT_ACCESS_TOKEN_5: ${{ secrets.TT_ACCESS_TOKEN_5 }}
          TT_ACCESS_TOKEN_6: ${{ secrets.TT_ACCESS_TOKEN_6 }}
          TT_ACCESS_TOKEN_7: ${{ secrets.TT_ACCESS_TOKEN_7 }}
          TT_ACCESS_TOKEN_8: ${{ secrets.TT_ACCESS_TOKEN_8 }}
          TT_ACCESS_TOKEN_9: ${{ secrets.TT_ACCESS_TOKEN_9 }}
          TT_ACCESS_TOKEN_10: ${{ secrets.TT_ACCESS_TOKEN_10 }}
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          TT_APP_ID: ${{ secrets.TT_APP_ID }}
          TT_APP_SECRET: ${{ secrets.TT_APP_SECRET }}
          # Base "Cập nhật BC - LLC 2026 mới" (doi Base: sua dong duoi)
          LARK_BASE_TOKEN: "HckTbAdYSafGYXsBVTYl4cdVgde"
          # sua file .run-now = chay lai toan bo 60 ngay + 3 thang truoc
          DAYS_BACK: ${{ github.event.inputs.days_back || (github.event_name == 'push' && '60') || '2' }}
          MONTHS_BACK: ${{ github.event.inputs.months_back || (github.event_name == 'push' && '3') || '0' }}
          PARALLEL: "3"
          FETCH_BALANCE: "1"
